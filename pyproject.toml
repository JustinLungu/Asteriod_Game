[project]
name = "asteriod-game"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gymnasium>=1.3.0",
    "pygame==2.6.1",
    "stable-baselines3>=2.9.0",
]

[project.scripts]
asteriod-game = "asteriod_game.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asteriod_game"]
